name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems** (for example a secret that leaks while it should be hidden) should not go here — use *Security → Report a vulnerability* instead. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots of the app are welcome — blur anything private first.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text…
        2. Open the app…
        3. …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.2, Apple Silicon"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ClipMac version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Release build (.dmg / .app)
        - cargo tauri dev
        - Built from source (cargo tauri build)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or terminal output
      description: If you ran with `cargo tauri dev`, paste any errors. **Remove anything private.**
      render: shell
